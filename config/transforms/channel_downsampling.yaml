# @package _global_
# Override channel_downsampling_factor on the CLI or in experiments.py to control
# how aggressively channels are subsampled.  With 16 EMG channels:
#   factor 1 → 16 ch  |  factor 2 → 8 ch  |  factor 4 → 4 ch
channel_downsampling_factor: 2

to_tensor:
  _target_: emg2pose.transforms.ExtractToTensor
  field: emg
channel_downsampling:
  _target_: emg2pose.transforms.ChannelDownsampling
  downsampling: ${channel_downsampling_factor}

transforms:
  train:
    - ${to_tensor}
    - ${channel_downsampling}
  val:
    - ${to_tensor}
    - ${channel_downsampling}
  test: ${transforms.val}
