# @package _global_
datamodule:
  _target_: emg2pose.lightning.ShardedEmgDataModule
  # Local SSD cache: ~10x faster than GCS FUSE reads.
  # Shards are downloaded on first access and served from disk on all later epochs.
  # Set to null to disable caching (slower but uses no extra disk space).
  cache_dir: /teamspace/studios/this_studio/.shard_cache
  # Shards prefetched per DataLoader worker in background threads.
  prefetch_shards: 4
