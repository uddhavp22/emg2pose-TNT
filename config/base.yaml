defaults:
  - _self_
  - datamodule: default
  - optimizer: adam
  - data_split: full_split
  - transforms: rotation_augmentation
  - experiment: tracking_vemg2pose

data_location: ~/emg2pose_data

seed: 42

batch_size: 64
num_workers: 0  # Number of workers for dataloading

# Weights & Biases configuration
wandb:
  enabled: True
  project: emg2pose
  entity: saarangp-ucla
  name: null  # Auto-generate run name if null
  tags: []  # Add tags like ["baseline", "lstm"] for organization
  notes: null  # Add experiment notes
  log_model: all  # Log all checkpoints (options: all, best, last, or False)
  save_dir: null  # Default to hydra output dir
  watch_model: True  # Watch model for gradients and parameters
  watch_log: all  # What to log: gradients, parameters, all, or None
  watch_log_freq: 100  # Log frequency for gradients/parameters
  watch_log_graph: True  # Log model computational graph

train: True  # Whether to run training
eval: True  # Whether to run evaluation on validation and test splits
checkpoint: null  # Optional path to checkpoint file

monitor_metric: val_loss
monitor_mode: min

loss_weights:
  mae: 1
  fingertip_distance: 0.01

trainer:
  max_epochs: 500

# By default: static learning rate
lr_scheduler:
  null

callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    save_last: True
    verbose: True
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    patience: 50
    check_on_train_epoch_end: False
    verbose: True

# Customize hydra directory outputs
# see: https://hydra.cc/docs/0.11/configure_hydra/workdir/
hydra:
  run:
    dir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}/seed=${seed}
  output_subdir: hydra_configs
  job:
    name: emg2pose
    config:
      override_dirname:
        exclude_keys:
          - seed
